server.port=${PORT:8080}
spring.profiles.active=local

# DataSource (Transaction Mode Pooler on 6543 to avoid EMAXCONNSESSION 15 limit)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.qyqdmtyqdzwduktabhuq
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — stay well under Supabase session-mode limit of 15
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8

# Auth cookie - set COOKIE_SECURE=true once served over HTTPS (see AuthController).
app.cookie.secure=${COOKIE_SECURE:false}
# SameSite policy - set COOKIE_SAME_SITE=None when frontend/backend are on different
# sites (e.g. separate *.onrender.com subdomains); requires COOKIE_SECURE=true.
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# CORS - comma-separated list of allowed frontend origins.
# On a public server, set CORS_ALLOWED_ORIGINS to the real frontend domain(s) only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Email invitations
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@aercs.app}

# Evidence upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage
app.supabase.url=https://qyqdmtyqdzwduktabhuq.supabase.co
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.storage-bucket=evidence-files
