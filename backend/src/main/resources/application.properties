server.port=${PORT:8080}
spring.profiles.active=local

# DataSource (Transaction Mode Pooler on 6543 to avoid EMAXCONNSESSION 15 limit)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.qyqdmtyqdzwduktabhuq
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — stay well under Supabase session-mode limit of 15
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8

# Password reset links stop working after this many minutes.
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:60}

# Auth cookie - defaults assume a cross-origin HTTPS deployment (frontend and API on
# different hosts), which requires Secure + SameSite=None together or browsers drop the cookie.
# Overridden for local HTTP dev in application-local.properties.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# CORS - comma-separated list of allowed frontend origins.
# On a public server, set CORS_ALLOWED_ORIGINS to the real frontend domain(s) only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Email invitations - sent via the Brevo HTTP API (not SMTP; Render blocks outbound
# SMTP traffic entirely). Create an API key at https://app.brevo.com (SMTP & API > API Keys).
# MAIL_FROM must be a sender verified in Brevo (Senders, Domains & Dedicated IPs > Senders).
app.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:olodinkrizza@gmail.com}
# Public address of the web app (no trailing slash), used for the logo and "Sign in" button in emails.
# Falls back to the first CORS_ALLOWED_ORIGINS entry when unset. The logo is only included for https URLs.
app.frontend-url=${FRONTEND_URL:}

# Evidence upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage
app.supabase.url=https://qyqdmtyqdzwduktabhuq.supabase.co
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.storage-bucket=evidence-files
